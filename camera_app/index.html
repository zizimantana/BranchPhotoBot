<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, user-scalable=no"
    >

    <title>Branch Photo Control</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
        }

        body {
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 18px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin: 5px 0 16px;
        }

        .branch {
            background: #222;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            text-align: center;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            color: #aaa;
            margin: 12px 0;
            min-height: 25px;
            line-height: 1.5;
        }

        .camera-box {
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }

        video {
            width: 100%;
            min-height: 280px;
            display: block;
            background: #000;
            object-fit: cover;
        }

        #preview {
            width: 100%;
            display: none;
            background: #000;
        }

        canvas {
            display: none;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 17px;
            margin-top: 14px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #takePhoto {
            background: #2196f3;
        }

        #retake {
            display: none;
            background: #555;
        }

        #submit {
            display: none;
            background: #16a34a;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            margin-top: 14px;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 17px;
            resize: vertical;
            display: none;
        }

        .info {
            background: #222;
            border-radius: 14px;
            padding: 17px;
            margin-top: 14px;
            line-height: 1.8;
            font-size: 17px;
            display: none;
        }

        .error {
            color: #ff5c5c;
            text-align: center;
            font-size: 16px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .success {
            color: #22c55e;
            text-align: center;
            font-size: 17px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .debug {
            color: #777;
            text-align: center;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-word;
        }

        .fallback {
            display: none;
            margin-top: 12px;
            text-align: center;
        }

        .fallback label {
            display: block;
            background: #333;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>📸 Branch Photo Control</h1>

    <div class="branch">
        🏢 Филиал:
        <strong id="branchName">Юкланмоқда...</strong>
    </div>

    <div id="loading" class="loading">
        Telegram маълумотлари текширилмоқда...
    </div>

    <div class="camera-box">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <img
            id="preview"
            alt="Captured photo"
        >

    </div>

    <canvas id="canvas"></canvas>

    <button
        id="takePhoto"
        disabled>
        📸 РАСМГА ОЛИШ
    </button>

    <button id="retake">
        🔄 ҚАЙТА ОЛИШ
    </button>

    <textarea
        id="comment"
        placeholder="Изоҳ киритинг...">
    </textarea>

    <div
        class="info"
        id="photoInfo">

        <div>
            🏢 Филиал:
            <span id="infoBranch"></span>
        </div>

        <div>
            📅 Сана:
            <span id="infoDate"></span>
        </div>

        <div>
            🕐 Вақт:
            <span id="infoTime"></span>
        </div>

    </div>

    <button id="submit">
        ✅ ЮБОРИШ
    </button>

    <div
        id="error"
        class="error">
    </div>

    <div
        id="success"
        class="success">
    </div>

    <div
        id="debug"
        class="debug">
    </div>

    <div
        id="fallback"
        class="fallback">

        <label for="fileInput">
            📷 Телефондан расм танлаш
        </label>

        <input
            id="fileInput"
            type="file"
            accept="image/*"
            capture="environment"
        >

    </div>

</div>


<script>

"use strict";


/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    try {
        tg.ready();
    } catch (e) {
        console.error(e);
    }

    try {
        tg.expand();
    } catch (e) {
        console.error(e);
    }
}


/* =========================================================
   VARIABLES
========================================================= */

let stream = null;

let capturedBlob = null;

let telegramInitData = "";

let employee = null;

let captureDate = "";

let captureTime = "";


/* =========================================================
   ELEMENTS
========================================================= */

const branchName =
    document.getElementById("branchName");

const loading =
    document.getElementById("loading");

const camera =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const preview =
    document.getElementById("preview");

const takePhoto =
    document.getElementById("takePhoto");

const retake =
    document.getElementById("retake");

const submit =
    document.getElementById("submit");

const comment =
    document.getElementById("comment");

const photoInfo =
    document.getElementById("photoInfo");

const infoBranch =
    document.getElementById("infoBranch");

const infoDate =
    document.getElementById("infoDate");

const infoTime =
    document.getElementById("infoTime");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const debug =
    document.getElementById("debug");

const fallback =
    document.getElementById("fallback");

const fileInput =
    document.getElementById("fileInput");


/* =========================================================
   ERROR
========================================================= */

function showError(text) {

    errorBox.textContent = text;

    successBox.textContent = "";
}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(text) {

    successBox.textContent = text;

    errorBox.textContent = "";
}


/* =========================================================
   TELEGRAM INIT DATA
========================================================= */

function getTelegramInitData() {

    if (!tg) {
        return "";
    }

    try {

        return tg.initData || "";

    } catch (error) {

        console.error(
            "INIT DATA ERROR:",
            error
        );

        return "";
    }
}


/* =========================================================
   DATE TIME
========================================================= */

function getDateTime() {

    const now = new Date();

    const date =
        String(now.getDate()).padStart(2, "0")
        + "."
        +
        String(now.getMonth() + 1).padStart(2, "0")
        + "."
        +
        now.getFullYear();

    const time =
        String(now.getHours()).padStart(2, "0")
        + ":"
        +
        String(now.getMinutes()).padStart(2, "0")
        + ":"
        +
        String(now.getSeconds()).padStart(2, "0");

    return {
        date,
        time
    };
}


/* =========================================================
   FETCH TIMEOUT
========================================================= */

function fetchWithTimeout(
    url,
    options = {},
    timeout = 15000
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    return fetch(
        url,
        {
            ...options,
            signal: controller.signal
        }
    ).finally(
        () => clearTimeout(timer)
    );
}


/* =========================================================
   LOAD USER
========================================================= */

async function initAndLoadUser() {

    if (!tg) {

        loading.style.display = "none";

        showError(
            "❌ Mini App Telegram ичида очилиши керак."
        );

        return;
    }


    loading.textContent =
        "🔐 Telegram маълумотлари олинмоқда...";


    /*
       Telegram initData баъзи қурилмаларда
       бироз кеч келиши мумкин.
    */

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        telegramInitData =
            getTelegramInitData();

        if (telegramInitData) {
            break;
        }

        await new Promise(
            resolve =>
                setTimeout(resolve, 300)
        );
    }


    console.log(
        "INIT DATA LENGTH:",
        telegramInitData.length
    );


    if (!telegramInitData) {

        loading.style.display = "none";

        showError(
            "❌ Telegram маълумотлари келмади. " +
            "Ботдаги 📸 РАСМГА ОЛИШ тугмаси орқали очинг."
        );

        return;
    }


    try {

        loading.textContent =
            "👤 Ходим маълумотлари олинмоқда...";


        const response =
            await fetchWithTimeout(
                "/api/me",
                {
                    method: "GET",

                    headers: {
                        "X-Telegram-Init-Data":
                            telegramInitData
                    },

                    cache: "no-store"
                },
                15000
            );


        let data;

        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Сервердан нотўғри жавоб келди."
            );
        }


        console.log(
            "API ME:",
            data
        );


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "Фойдаланувчи аниқланмади."
            );
        }


        employee =
            data.user;


        /*
           Backend branchName ёки
           branch_name қайтариши мумкин.
        */

        const branch =
            employee.branchName ||
            employee.branch_name ||
            "Номаълум филиал";


        branchName.textContent =
            branch;

        infoBranch.textContent =
            branch;


        loading.textContent =
            "📷 Камера ишга туширилмоқда...";


        await startCamera();


        loading.style.display =
            "none";

        takePhoto.disabled =
            false;

        showSuccess(
            "✅ Филиал аниқланди."
        );

        setTimeout(
            () => {
                successBox.textContent = "";
            },
            2000
        );

    }

    catch (error) {

        console.error(
            "INIT ERROR:",
            error
        );

        loading.style.display =
            "none";


        if (
            error.name === "AbortError"
        ) {

            showError(
                "❌ Серверга уланиш вақти тугади."
            );

        } else {

            showError(
                "❌ " +
                (
                    error.message ||
                    "Хатолик юз берди."
                )
            );
        }
    }
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            fallback.style.display =
                "block";

            throw new Error(
                "Бу браузерда камера API ишламайди. Телефондан расм танланг."
            );
        }


        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            stream = null;
        }


        /*
           Аввал орқа камерани сўраймиз.
        */

        try {

            stream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: {
                            facingMode: {
                                ideal: "environment"
                            },

                            width: {
                                ideal: 1920
                            },

                            height: {
                                ideal: 1080
                            }
                        },

                        audio: false
                    }
                );

        }

        catch (firstError) {

            console.warn(
                "ENVIRONMENT CAMERA FAILED:",
                firstError
            );


            /*
               Агар орқа камера ишламаса,
               оддий камерани сўраймиз.
            */

            stream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: true,
                        audio: false
                    }
                );
        }


        camera.srcObject =
            stream;


        await camera.play();


        camera.style.display =
            "block";

        fallback.style.display =
            "none";


        console.log(
            "CAMERA STARTED"
        );

    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        fallback.style.display =
            "block";


        throw new Error(
            "❌ Камера очилмади. Telegram/браузерда камерага рухсат беринг ёки пастдаги расм танлашни ишлатинг."
        );
    }
}


/* =========================================================
   TAKE PHOTO
========================================================= */

takePhoto.addEventListener(
    "click",
    function () {

        errorBox.textContent = "";

        successBox.textContent = "";

        debug.textContent = "";


        if (!employee) {

            showError(
                "❌ Ходим маълумотлари топилмади."
            );

            return;
        }


        if (!stream) {

            showError(
                "❌ Камера тайёр эмас."
            );

            return;
        }


        const width =
            camera.videoWidth;

        const height =
            camera.videoHeight;


        if (
            !width ||
            !height
        ) {

            showError(
                "❌ Камера тасвири ҳали тайёр эмас."
            );

            return;
        }


        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext("2d");


        if (!ctx) {

            showError(
                "❌ Canvas ишламади."
            );

            return;
        }


        ctx.drawImage(
            camera,
            0,
            0,
            width,
            height
        );


        const dt =
            getDateTime();


        captureDate =
            dt.date;

        captureTime =
            dt.time;


        /*
           WATERMARK
        */

        const boxHeight =
            Math.max(
                150,
                Math.floor(
                    height * 0.20
                )
            );


        ctx.fillStyle =
            "rgba(0,0,0,0.70)";


        ctx.fillRect(
            0,
            height - boxHeight,
            width,
            boxHeight
        );


        const fontSize =
            Math.max(
                26,
                Math.floor(
                    width / 32
                )
            );


        ctx.font =
            "bold " +
            fontSize +
            "px Arial";


        ctx.fillStyle =
            "#ffffff";


        const padding =
            Math.max(
                25,
                Math.floor(
                    width / 40
                )
            );


        const lineHeight =
            Math.floor(
                fontSize * 1.25
            );


        const y1 =
            height -
            boxHeight +
            padding +
            lineHeight;

        const y2 =
            y1 +
            lineHeight;

        const y3 =
            y2 +
            lineHeight;


        const branch =
            employee.branchName ||
            employee.branch_name ||
            "Номаълум";


        ctx.fillText(
            "Branch: " + branch,
            padding,
            y1
        );


        ctx.fillText(
            "Date: " + captureDate,
            padding,
            y2
        );


        ctx.fillText(
            "Time: " + captureTime,
            padding,
            y3
        );


        canvas.toBlob(
            function (blob) {

                if (
                    !blob ||
                    blob.size === 0
                ) {

                    showError(
                        "❌ Расм тайёрлашда хатолик."
                    );

                    return;
                }


                capturedBlob =
                    blob;


                if (
                    preview.dataset.objectUrl
                ) {

                    URL.revokeObjectURL(
                        preview.dataset.objectUrl
                    );
                }


                const objectUrl =
                    URL.createObjectURL(
                        blob
                    );


                preview.dataset.objectUrl =
                    objectUrl;

                preview.src =
                    objectUrl;


                camera.style.display =
                    "none";

                preview.style.display =
                    "block";


                takePhoto.style.display =
                    "none";

                retake.style.display =
                    "block";

                submit.style.display =
                    "block";

                comment.style.display =
                    "block";

                photoInfo.style.display =
                    "block";


                infoBranch.textContent =
                    branch;

                infoDate.textContent =
                    captureDate;

                infoTime.textContent =
                    captureTime;

            },
            "image/jpeg",
            0.92
        );
    }
);


/* =========================================================
   RETAKE
========================================================= */

retake.addEventListener(
    "click",
    async function () {

        capturedBlob =
            null;


        if (
            preview.dataset.objectUrl
        ) {

            URL.revokeObjectURL(
                preview.dataset.objectUrl
            );

            delete preview.dataset.objectUrl;
        }


        preview.src =
            "";

        preview.style.display =
            "none";


        camera.style.display =
            "block";


        takePhoto.style.display =
            "block";

        retake.style.display =
            "none";

        submit.style.display =
            "none";

        comment.style.display =
            "none";

        photoInfo.style.display =
            "none";


        comment.value =
            "";


        errorBox.textContent =
            "";

        successBox.textContent =
            "";


        try {

            await startCamera();

        }

        catch (error) {

            showError(
                error.message
            );
        }
    }
);


/* =========================================================
   SUBMIT PHOTO
========================================================= */

submit.addEventListener(
    "click",
    async function () {

        if (
            !capturedBlob ||
            capturedBlob.size === 0
        ) {

            showError(
                "❌ Аввал расм олинг."
            );

            return;
        }


        if (!telegramInitData) {

            showError(
                "❌ Telegram авторизацияси топилмади."
            );

            return;
        }


        if (!employee) {

            showError(
                "❌ Ходим маълумотлари топилмади."
            );

            return;
        }


        submit.disabled =
            true;

        submit.textContent =
            "⏳ ЮБОРИЛМОҚДА...";


        errorBox.textContent =
            "";

        successBox.textContent =
            "";


        try {

            const formData =
                new FormData();


            formData.append(
                "photo",
                capturedBlob,
                "photo.jpg"
            );


            formData.append(
                "comment",
                comment.value.trim()
            );


            formData.append(
                "deviceTimestamp",
                new Date().toISOString()
            );


            const response =
                await fetchWithTimeout(
                    "/api/submit-photo",
                    {
                        method: "POST",

                        headers: {
                            "X-Telegram-Init-Data":
                                telegramInitData
                        },

                        body:
                            formData
                    },
                    30000
                );


            let data;

            try {

                data =
                    await response.json();

            }

            catch {

                throw new Error(
                    "Сервердан нотўғри жавоб келди."
                );
            }


            console.log(
                "SUBMIT RESPONSE:",
                data
            );


            if (
                !response.ok ||
                !data.ok
            ) {

                throw new Error(
                    data.error ||
                    "Расм юборилмади."
                );
            }


            showSuccess(
                "✅ Расм муваффақиятли юборилди!"
            );


            submit.textContent =
                "✅ ЮБОРИЛДИ";


            setTimeout(
                async function () {

                    capturedBlob =
                        null;


                    if (
                        preview.dataset.objectUrl
                    ) {

                        URL.revokeObjectURL(
                            preview.dataset.objectUrl
                        );

                        delete preview.dataset.objectUrl;
                    }


                    preview.src =
                        "";

                    preview.style.display =
                        "none";

                    camera.style.display =
                        "block";


                    takePhoto.style.display =
                        "block";

                    retake.style.display =
                        "none";

                    submit.style.display =
                        "none";

                    comment.style.display =
                        "none";

                    photoInfo.style.display =
                        "none";


                    comment.value =
                        "";


                    submit.disabled =
                        false;

                    submit.textContent =
                        "✅ ЮБОРИШ";


                    errorBox.textContent =
                        "";

                    successBox.textContent =
                        "";


                    try {

                        await startCamera();

                    }

                    catch (error) {

                        showError(
                            error.message
                        );
                    }

                },
                2500
            );

        }

        catch (error) {

            console.error(
                "SUBMIT ERROR:",
                error
            );


            if (
                error.name === "AbortError"
            ) {

                showError(
                    "❌ Расм юбориш вақти тугади. Қайта уриниб кўринг."
                );

            }

            else {

                showError(
                    "❌ " +
                    (
                        error.message ||
                        "Расм юборишда хатолик."
                    )
                );
            }


            submit.disabled =
                false;

            submit.textContent =
                "✅ ЮБОРИШ";
        }
    }
);


/* =========================================================
   FILE FALLBACK
========================================================= */

fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files &&
            fileInput.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith("image/")
        ) {

            showError(
                "❌ Фақат расм файл танланг."
            );

            return;
        }


        capturedBlob =
            file;


        const objectUrl =
            URL.createObjectURL(
                file
            );


        if (
            preview.dataset.objectUrl
        ) {

            URL.revokeObjectURL(
                preview.dataset.objectUrl
            );
        }


        preview.dataset.objectUrl =
            objectUrl;

        preview.src =
            objectUrl;


        const dt =
            getDateTime();


        captureDate =
            dt.date;

        captureTime =
            dt.time;


        const branch =
            employee
                ? (
                    employee.branchName ||
                    employee.branch_name ||
                    "Номаълум"
                )
                : "Номаълум";


        infoBranch.textContent =
            branch;

        infoDate.textContent =
            captureDate;

        infoTime.textContent =
            captureTime;


        camera.style.display =
            "none";

        preview.style.display =
            "block";


        takePhoto.style.display =
            "none";

        retake.style.display =
            "block";

        submit.style.display =
            "block";

        comment.style.display =
            "block";

        photoInfo.style.display =
            "block";


        showSuccess(
            "✅ Расм танланди."
        );
    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            stream =
                null;
        }


        if (
            preview.dataset.objectUrl
        ) {

            URL.revokeObjectURL(
                preview.dataset.objectUrl
            );
        }
    }
);


/* =========================================================
   START
========================================================= */

initAndLoadUser();

</script>
